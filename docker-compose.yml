name: trueflag-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trueflag
      POSTGRES_DB: trueflag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueflag -d trueflag"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trueflag:${POSTGRES_PASSWORD}@db:5432/trueflag
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: compose
      DATABASE_URL: postgresql+psycopg://trueflag:${POSTGRES_PASSWORD}@db:5432/trueflag
    ports: ["127.0.0.1:${BACKEND_PORT:-8010}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-8088}:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:

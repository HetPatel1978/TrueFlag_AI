name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trueflag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d trueflag_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trueflag_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Generate ephemeral test signing secret
        run: python -c "import secrets; print('JWT_SECRET=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m pytest backend/tests -q
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python scripts/verify_postgres.py
      - run: python scripts/check_publication.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

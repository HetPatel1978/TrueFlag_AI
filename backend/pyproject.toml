[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "trueflag-ai-backend"
version = "0.1.0"
description = "TrueFlag AI investigation platform foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.136,<1", "uvicorn[standard]>=0.44,<1",
  "pydantic-settings>=2.12,<3", "SQLAlchemy>=2.0.40,<2.1",
  "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
    location = /ready { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
